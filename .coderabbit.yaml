# CodeRabbit configuration.
#
# CodeRabbit is free for public repositories. It is deliberately NOT treated as a
# security gate -- the gates are the `security` job in ci.yml (pip-audit / bandit /
# gitleaks) and the CodeQL workflow, both of which fail the build. This is an
# always-on third reviewer alongside the Claude + Codex protocol in COLLAB.md.
#
# The `path_instructions` below are the point of this file. A generic LLM reviewer
# would not know this project's invariants and would mostly restate what ruff and
# import-linter already enforce; feeding it the actual architecture rules (ADR 0001)
# is what makes it complementary rather than redundant.

language: "en-US"

reviews:
  profile: "chill"                # assertive mode is noisy on a small, tidy codebase
  request_changes_workflow: false # advisory only -- it must never block a merge
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false                 # draft PRs are work-in-progress by convention here

  path_filters:
    # Phase 1 is FROZEN and independently validated (CLAUDE.md). Never review it --
    # any suggestion would be unactionable by definition.
    - "!phase1_cdr/**"
    # Third-party redistributable Microsoft WebView2 interop assemblies.
    - "!vendor/**"
    # Binary fixtures; regenerated by tools/gen_matcher_scenarios.py, not hand-edited.
    - "!**/*.xlsx"
    # A 300KB append-only intent log. Reviewing prose diffs here is pure noise.
    - "!HANDOFF.md"

  path_instructions:
    - path: "app/**/routes.py"
      instructions: >
        APPLICATION layer. Enforce: routes must never write SQL directly (call the
        domain's repo.py instead); the route owns the unit-of-work, so it is the
        route -- not the repo -- that calls audit.write_audit(conn, ...) and then
        conn.commit() / conn.rollback(); auth identity is read via
        api.guards.current_username(), never current_app.config["USERNAME"].
        Flag any deviation from these three as a correctness issue, not a nitpick.

    - path: "app/**/repo.py"
      instructions: >
        DOMAIN/DATA layer. Repos take a `conn`, return plain dicts or scalars, and
        import `infra` only -- never audit, api, or flask. A repo must NEVER commit
        or roll back. Any SQL built by string concatenation or f-string must
        interpolate only literals defined in that same module or `?` placeholders;
        a caller-supplied value reaching the SQL text (rather than the bind tuple)
        is a real injection finding, so say so plainly.

    - path: "app/matching/gates.py"
      instructions: >
        Pure module -- no I/O, no database, no Flask. Thresholds are deliberately
        labelled PROPOSAL pending domain sign-off; do not suggest "cleaning up" those
        markers. Behaviour here is specified by
        docs/superpowers/specs/2026-07-13-adaptive-matcher-gates.md and the
        2026-07-14 conditional-hub-counting design -- flag any change that
        contradicts either spec.

    - path: "app/infra/**"
      instructions: >
        INFRA layer: no domain logic and no Flask imports. crypto.py is
        security-critical (bcrypt password verifier, scrypt KEK, AES-GCM key
        wrapping) -- scrutinise any change to salt/nonce generation, key length, or
        error handling, and never suggest weakening a parameter for performance.
        Phase 1 is reachable only through infra/phase1.py.

    - path: "app/web/js/**"
      instructions: >
        Vanilla, no-build ES modules by design -- do NOT suggest a framework, a
        bundler, TypeScript, or a package.json. Logic worth testing is extracted as
        a pure exported function and tested in components.test.mjs with Node's
        built-in runner. Renaming or removing an exported symbol can break Python
        tests: tests/phase2a/test_ui.py greps the served JS for symbol names.

    - path: "tests/**"
      instructions: >
        Check that a test would actually FAIL if the behaviour it names regressed --
        vacuous assertions (asserting on a mock, or on a condition true by
        construction) have slipped through here before and are worth calling out.

chat:
  auto_reply: true
