# Tooling config for the Phase 2A backend + the modular-monolith reorg (ADR 0001).
# NOTE: Phase 1 (phase1_cdr/) is FROZEN and independently validated — it is excluded
# from every tool here. The .venv and vendored DLLs are excluded too.
#
# The ruff and import-linter CI *gates* are wired in the final reorg step (Step 9),
# after the package structure exists; until then these configs are for local use.

[tool.ruff]
target-version = "py311"
line-length = 120              # fits the existing code; no reflow churn pre-reorg
extend-exclude = ["phase1_cdr", "vendor", ".venv", "app/web"]
# force-exclude guarantees the frozen phase1_cdr/ is skipped even when a path is passed
# explicitly (e.g. `ruff check .` or `ruff check phase1_cdr`), not just on auto-discovery.
force-exclude = true

[tool.ruff.lint]
# Core rule set now: pycodestyle errors/warnings + pyflakes.
# Import sorting ("I") and broader families are enabled in Step 9, AFTER the reorg
# finalizes every import block — enforcing isort now would just be re-done churn.
select = ["E", "F", "W"]

# import-linter (boundary enforcement). Authored to the target structure in
# docs/adr/0001-modular-monolith.md and activated now (Step 9) — every package it
# references exists. Each contract is validated against a deliberate bad import in
# CI before being trusted (grimp has no win_arm64 wheel, so lint-imports runs in CI
# on ubuntu x64, not on the ARM64 dev machine).
[tool.importlinter]
root_package = "app"

# 1) Layered architecture (module-level, highest first). API helpers are low-level
#    SUPPORT, routes are the top APPLICATION layer, so app.api deliberately spans
#    layers. infra + audit are named as packages (intra-package imports allowed).
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "app.api.system | app.auth.routes | app.datasets.routes | app.targets.routes | app.analysis.routes",
    "app.auth.account | app.datasets.repo | app.datasets.validation | app.targets.repo | app.analysis.repo | app.analysis.bridge",
    "app.audit",
    "app.api.guards | app.api.errors",
    "app.api.responses",
    "app.infra",
]

# 2) Domains may not import one another's internals (cross-domain needs go through
#    a shared module). auth is a domain too.
[[tool.importlinter.contracts]]
name = "Domains are independent"
type = "independence"
modules = [
    "app.auth",
    "app.datasets",
    "app.targets",
    "app.analysis",
]

# 3) Phase 1 is reached ONLY through app.infra.phase1. Every app module except that
#    seam is forbidden from importing the frozen detection/loader modules.
#    allow_indirect_imports keeps the legitimate bridge -> infra.phase1 -> detection
#    chain green (only the direct import is checked).
[[tool.importlinter.contracts]]
name = "Phase 1 only via infra.phase1"
type = "forbidden"
source_modules = [
    "app.api",
    "app.auth",
    "app.audit",
    "app.datasets",
    "app.targets",
    "app.analysis",
    "app.infra.config",
    "app.infra.crypto",
    "app.infra.storage",
]
forbidden_modules = [
    "detection",
    "loader",
]
include_external_packages = true
allow_indirect_imports = true

# 4) Repos are pure data access: they must not import audit or the api/web layer
#    (the no-flask-in-repos rule is enforced by the AST test in tests/architecture/).
[[tool.importlinter.contracts]]
name = "Repos import neither audit nor api"
type = "forbidden"
source_modules = [
    "app.datasets.repo",
    "app.targets.repo",
    "app.analysis.repo",
]
forbidden_modules = [
    "app.audit",
    "app.api",
]
