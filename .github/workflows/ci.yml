name: CI

# Runs both suites on every push and pull request, so correctness no longer
# depends on one machine being able to load pandas (Phase 1) or the SQLCipher /
# crypto stack (Phase 2A). See HANDOFF.md.
on:
  push:
  pull_request:

jobs:
  # Phase 1 — algorithm validation. Self-contained in phase1_cdr/.
  test:
    runs-on: ubuntu-latest

    # Everything lives in the phase1_cdr/ package: requirements.txt, the tests/
    # dir, and conftest.py (which puts this dir on sys.path so tests import
    # detection/loader directly). Run all steps from there.
    defaults:
      run:
        working-directory: phase1_cdr

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # 3.12 matches the verified environment (Khaled's run: Python 3.12.10).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phase1_cdr/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Shared lock at the repo root (one level up from this job's working dir).
          pip install -r requirements.txt -c ../constraints.txt

      - name: Run unit tests
        run: pytest tests/

      - name: Run validation harness
        run: python main.py sample_data.csv ground_truth.json

  # Phase 2A — backend (Flask + SQLCipher). Runs from the repo root, where the
  # root requirements.txt, pytest.ini, the app/ package, and tests/phase2a/ live.
  phase2a:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # 3.11 matches the locally-verified Phase 2A environment (3.11.9).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # sqlcipher3-wheels ships manylinux x86_64 wheels and cryptography/bcrypt
          # have prebuilt wheels, so no SQLCipher/OpenSSL/Rust toolchain is needed.
          # pywebview's base install pulls no GTK/Qt and the tests never import it
          # (the window lives behind `if __name__`/pragma-no-cover in main.py).
          pip install -r requirements.txt -c constraints.txt

      - name: Run Phase 2A + architecture tests
        run: pytest tests/phase2a tests/architecture

  # Phase 2B — frontend. The SPA is vanilla, no-build JS, so there is nothing to
  # compile and no JS test framework (by design). This job is a cheap guard:
  # node --check syntax-validates every module so a broken file can't merge.
  # (Behavioural coverage of app/ui.py lives in the phase2a pytest job above.)
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check all JS modules
        run: |
          find app/web/js -name '*.js' -print0 | xargs -0 -n1 node --check

  # Boundaries — ruff lint + import-linter contract enforcement (ADR 0001).
  # Runs on ubuntu x64, where grimp (import-linter's dependency) has prebuilt
  # wheels; it cannot build on the win_arm64 dev machine, so this is the gate.
  boundaries:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps are needed so import-linter/grimp can resolve the app
          # package graph (it locates modules via the installed package). The
          # shared lock pins the runtime stack; dev tools (ruff/import-linter)
          # are intentionally unpinned.
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Lint (ruff)
        run: ruff check app tests main.py

      - name: Enforce import boundaries (import-linter)
        run: lint-imports
