name: CI

# Runs both suites on every push and pull request, so correctness no longer
# depends on one machine being able to load pandas (Phase 1) or the SQLCipher /
# crypto stack (Phase 2A). See HANDOFF.md.
on:
  push:
  pull_request:
  # A dependency CVE is published on the advisory database's clock, not ours: the
  # `security` job below can start failing on a commit nobody made. The weekly tick
  # is what turns pip-audit from a merge-time snapshot into actual monitoring.
  # (All jobs run; the whole workflow is a few minutes, so splitting it isn't worth
  # the duplication.) Scheduled runs use the default branch.
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  # Phase 1 — algorithm validation. Self-contained in phase1_cdr/.
  test:
    runs-on: ubuntu-latest

    # Everything lives in the phase1_cdr/ package: requirements.txt, the tests/
    # dir, and conftest.py (which puts this dir on sys.path so tests import
    # detection/loader directly). Run all steps from there.
    defaults:
      run:
        working-directory: phase1_cdr

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # 3.12 matches the verified environment (Khaled's run: Python 3.12.10).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phase1_cdr/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Shared lock at the repo root (one level up from this job's working dir).
          pip install -r requirements.txt -c ../constraints.txt

      - name: Run unit tests
        run: pytest tests/

      - name: Run validation harness
        run: python main.py sample_data.csv ground_truth.json

  # Phase 2A — backend (Flask + SQLCipher). Runs from the repo root, where the
  # root requirements.txt, pytest.ini, the app/ package, and tests/phase2a/ live.
  phase2a:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # 3.11 matches the locally-verified Phase 2A environment (3.11.9).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # sqlcipher3-wheels ships manylinux x86_64 wheels and cryptography/bcrypt
          # have prebuilt wheels, so no SQLCipher/OpenSSL/Rust toolchain is needed.
          # pywebview's base install pulls no GTK/Qt and the tests never import it
          # (the window lives behind `if __name__`/pragma-no-cover in main.py).
          pip install -r requirements.txt -c constraints.txt

      - name: Run Phase 2A + architecture tests
        run: pytest tests/phase2a tests/architecture

  # Phase 2B — frontend. The SPA is vanilla, no-build JS, so there is nothing to
  # compile and no JS test framework (by design). This job is a cheap guard:
  # node --check syntax-validates every module so a broken file can't merge.
  # (Behavioural coverage of app/ui.py lives in the phase2a pytest job above.)
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Syntax-check all JS modules
        run: |
          find app/web/js -name '*.js' -print0 | xargs -0 -n1 node --check

      # The one place the SPA carries real logic worth asserting (the binding-gate
      # note re-derives a decision from the frozen Phase 1 gate vector). Uses
      # Node's built-in runner only — still no JS framework. Explicit file paths
      # (Node 20 predates --test glob support). Add new *.test.mjs files here.
      - name: Run frontend unit tests (node:test)
        run: node --test app/web/js/components.test.mjs

  # Boundaries — ruff lint + import-linter contract enforcement (ADR 0001).
  # Runs on ubuntu x64, where grimp (import-linter's dependency) has prebuilt
  # wheels; it cannot build on the win_arm64 dev machine, so this is the gate.
  boundaries:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps are needed so import-linter/grimp can resolve the app
          # package graph (it locates modules via the installed package). The
          # shared lock pins the runtime stack; dev tools (ruff/import-linter)
          # are intentionally unpinned.
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Lint (ruff)
        run: ruff check app tests main.py

      - name: Enforce import boundaries (import-linter)
        run: lint-imports

  # Security — the three checks the other jobs genuinely do not make. ruff covers
  # style, import-linter + tests/architecture/ cover structure, pytest covers
  # behaviour; none of them look at known CVEs in the dependency stack, at insecure
  # *patterns* in our own Python, or at credentials committed to git history. Three
  # focused open-source scanners cover exactly those three gaps, in-repo, with no
  # third-party service holding a token on this repository.
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. A secret that was committed and later deleted is still
          # leaked, so gitleaks must see every commit, not just the tip.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          # Dev tools only -- this job never imports the app, so the runtime stack is
          # not installed. requirements-dev.txt is the single source of truth for what
          # the gates are (installing it here also proves that file still resolves).
          # Deliberately WITHOUT -c constraints.txt, unlike the other jobs: that lock
          # exists to freeze the *runtime* stack, and forcing it on the scanners'
          # own dependency trees (pip-audit wants a newer `packaging` than the app's
          # pin) would make the security gate fail for a reason that isn't security.
          # The lock is still audited -- as a *file*, in the pip-audit step below.
          pip install -r requirements-dev.txt

      # constraints.txt is the full pinned transitive set (generated from pip freeze),
      # so --no-deps audits exactly what every other job installs, with no resolution
      # round-trip. It covers the Phase 1 job too: the lock is a superset of its deps.
      # --strict fails the build if any pin could not be audited, so a silent skip
      # cannot read as a pass.
      - name: Audit locked dependencies for known CVEs (pip-audit)
        run: pip-audit --strict --no-deps -r constraints.txt

      # Config (incl. the medium/medium rationale) lives in [tool.bandit] in
      # pyproject.toml, alongside ruff and import-linter.
      - name: Python SAST (bandit)
        run: bandit -c pyproject.toml -r app main.py tools --severity-level medium --confidence-level medium

      - name: Scan git history for secrets (gitleaks)
        env:
          # Pinned and checksummed: this step downloads a binary, so it must not
          # trust "latest". The official gitleaks-action is deliberately NOT used --
          # it requires a paid GITLEAKS_LICENSE for repos owned by an organization
          # (this one is), so it would fail on every run here.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # --redact so a finding can never print the secret itself into the build log.
          ./gitleaks git . --redact --no-banner
